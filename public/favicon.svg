<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gaugeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="82%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Dark motorsport rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#080d1a" stroke="#1e293b" stroke-width="2" />

  <!-- Speedometer / telemetry arc (background track) -->
  <path
    d="M 17 46 A 19 19 0 1 1 47 46"
    fill="none"
    stroke="#1e293b"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Active telemetry arc (Cyan to Redline) -->
  <path
    d="M 17 46 A 19 19 0 1 1 47 46"
    fill="none"
    stroke="url(#gaugeGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Center Hub -->
  <circle cx="32" cy="33" r="4.5" fill="#080d1a" stroke="#38bdf8" stroke-width="2" />
  <circle cx="32" cy="33" r="2" fill="#38bdf8" />

  <!-- Crisp Speed Needle pointing up-right -->
  <line x1="32" y1="33" x2="45" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
</svg>
